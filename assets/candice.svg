<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Candice in her candle workshop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E9D4"/>
      <stop offset="1" stop-color="#E7D6B6"/>
    </linearGradient>
    <linearGradient id="wax2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#E7D4AC"/>
    </linearGradient>
  </defs>
  <rect width="640" height="720" fill="url(#bg)"/>

  <!-- window light -->
  <rect x="430" y="40" width="170" height="240" rx="6" fill="#FBF3DF" opacity=".7"/>
  <line x1="515" y1="40" x2="515" y2="280" stroke="#D7C29A" stroke-width="3"/>
  <line x1="430" y1="160" x2="600" y2="160" stroke="#D7C29A" stroke-width="3"/>

  <!-- shelf with jars -->
  <rect x="20" y="120" width="300" height="14" rx="3" fill="#B89160"/>
  <g>
    <rect x="44" y="70" width="40" height="50" rx="6" fill="#C98A4A" opacity=".85"/>
    <rect x="98" y="64" width="40" height="56" rx="6" fill="url(#wax2)" stroke="#D9C49A"/>
    <rect x="152" y="72" width="40" height="48" rx="6" fill="#C98A4A" opacity=".85"/>
    <rect x="206" y="66" width="40" height="54" rx="6" fill="url(#wax2)" stroke="#D9C49A"/>
    <rect x="260" y="74" width="40" height="46" rx="6" fill="#C98A4A" opacity=".85"/>
  </g>

  <!-- figure -->
  <g>
    <!-- sweater -->
    <path d="M180 720 Q180 470 320 460 Q460 470 460 720 Z" fill="#5E739A"/>
    <path d="M210 720 Q210 540 320 540 Q430 540 430 720 Z" fill="#6B81A8" opacity=".6"/>
    <!-- neck -->
    <rect x="296" y="392" width="48" height="70" rx="20" fill="#E7B894"/>
    <!-- head -->
    <circle cx="320" cy="330" r="86" fill="#EEC4A0"/>
    <!-- hair -->
    <path d="M232 332 Q220 220 320 214 Q420 220 408 332 Q420 300 412 270 Q404 196 320 196 Q236 196 228 270 Q220 300 232 332 Z" fill="#D8D2C7"/>
    <path d="M236 330 Q224 300 236 264 M404 330 Q416 300 404 264" stroke="#C7C0B2" stroke-width="6" fill="none"/>
    <!-- glasses -->
    <g stroke="#7A5A3A" stroke-width="4" fill="none">
      <rect x="276" y="320" width="40" height="30" rx="10"/>
      <rect x="328" y="320" width="40" height="30" rx="10"/>
      <line x1="316" y1="332" x2="328" y2="332"/>
    </g>
    <!-- smile -->
    <path d="M296 372 Q320 392 344 372" stroke="#B57A57" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- book held -->
  <g transform="rotate(-6 250 600)">
    <rect x="150" y="520" width="220" height="170" rx="8" fill="#FCF6EA" stroke="#E0CDA6" stroke-width="3"/>
    <text x="260" y="566" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3A2C1A">THE $3</text>
    <text x="260" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#3A2C1A">LUXURY CANDLE</text>
    <circle cx="260" cy="640" r="24" fill="#F0C778"/>
    <path d="M260 614 q9 13 0 24 q-9 -11 0 -24 Z" fill="#E89A36"/>
  </g>
</svg>
